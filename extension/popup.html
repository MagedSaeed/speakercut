<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>SpeakerCut</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="hero">
    <svg class="wave" viewBox="0 0 340 56" preserveAspectRatio="none" aria-hidden="true">
      <g fill="#5AA9FF" opacity=".55">
        <rect x="8" y="30" width="5" height="14" rx="2.5"/><rect x="17" y="24" width="5" height="26" rx="2.5"/>
        <rect x="26" y="16" width="5" height="40" rx="2.5"/><rect x="35" y="22" width="5" height="30" rx="2.5"/>
        <rect x="44" y="12" width="5" height="44" rx="2.5"/><rect x="53" y="26" width="5" height="22" rx="2.5"/>
        <rect x="62" y="18" width="5" height="36" rx="2.5"/><rect x="71" y="28" width="5" height="18" rx="2.5"/>
        <rect x="80" y="14" width="5" height="42" rx="2.5"/><rect x="89" y="22" width="5" height="30" rx="2.5"/>
        <rect x="98" y="30" width="5" height="14" rx="2.5"/><rect x="107" y="20" width="5" height="34" rx="2.5"/>
        <rect x="116" y="26" width="5" height="22" rx="2.5"/><rect x="125" y="16" width="5" height="40" rx="2.5"/>
        <rect x="134" y="24" width="5" height="26" rx="2.5"/><rect x="143" y="30" width="5" height="14" rx="2.5"/>
        <rect x="152" y="20" width="5" height="34" rx="2.5"/><rect x="161" y="27" width="5" height="20" rx="2.5"/>
      </g>
      <rect x="171" y="4" width="2" height="52" rx="1" fill="#fff" opacity=".85"/>
      <g fill="#FFB547" opacity=".55">
        <rect x="180" y="22" width="5" height="30" rx="2.5"/><rect x="189" y="10" width="5" height="46" rx="2.5"/>
        <rect x="198" y="24" width="5" height="26" rx="2.5"/><rect x="207" y="16" width="5" height="40" rx="2.5"/>
        <rect x="216" y="28" width="5" height="18" rx="2.5"/><rect x="225" y="20" width="5" height="34" rx="2.5"/>
        <rect x="234" y="14" width="5" height="42" rx="2.5"/><rect x="243" y="26" width="5" height="22" rx="2.5"/>
        <rect x="252" y="18" width="5" height="36" rx="2.5"/><rect x="261" y="30" width="5" height="14" rx="2.5"/>
        <rect x="270" y="22" width="5" height="30" rx="2.5"/><rect x="279" y="12" width="5" height="44" rx="2.5"/>
        <rect x="288" y="26" width="5" height="22" rx="2.5"/><rect x="297" y="18" width="5" height="36" rx="2.5"/>
        <rect x="306" y="28" width="5" height="18" rx="2.5"/><rect x="315" y="22" width="5" height="30" rx="2.5"/>
        <rect x="324" y="30" width="5" height="14" rx="2.5"/>
      </g>
    </svg>
    <div class="brand">
      <img src="icons/icon48.png" width="30" height="30" alt="">
      <h1>SpeakerCut</h1>
      <button id="status" class="status" data-state="checking" title="Check the server again">
        <span class="dot"></span><span id="statusText">Checking</span>
      </button>
    </div>
    <p class="tagline">Adds draft speaker segments. Never submits.</p>
  </header>

  <main>
    <div class="col">
    <section>
      <label class="field" for="serverUrl">
        <span class="name">Server<button type="button" class="tip" aria-label="About Server" data-tip="Address of the SpeakerCut diarization server. Keep http://127.0.0.1:8000 if the server runs on this computer or reaches it through an SSH tunnel.">i</button></span>
        <input type="url" id="serverUrl" spellcheck="false" autocomplete="off">
      </label>
      <p id="serverInfo" class="info" aria-live="polite"></p>

      <div class="field lockable">
        <span class="name" id="providerLabel">Diarization<button type="button" class="tip" aria-label="About Diarization" data-tip="What finds who speaks when. Local pyannote runs free on your server. pyannoteAI uses a hosted, more accurate model that helps when speakers get mixed up; it is paid, and the clip&#x27;s audio is sent to pyannoteAI.">i</button></span>
        <div class="segmented" role="radiogroup" aria-labelledby="providerLabel">
          <label><input type="radio" name="provider" value="local"><span>Local pyannote<small>Free</small></span></label>
          <label><input type="radio" name="provider" value="pyannoteai"><span>pyannoteAI<small>API key</small></span></label>
        </div>
      </div>

      <label class="switch lockable" for="removeMusic">
        <span><b>Remove music first<button type="button" class="tip" aria-label="About Remove music first" data-tip="Strips background music (Demucs) before finding speakers. Cut points still line up with the original audio. Helps with loud music in series; it is slower, so leave it off for clean speech.">i</button></b><small>Separates vocals before diarizing</small></span>
        <input type="checkbox" id="removeMusic"><i></i>
      </label>
    </section>

    <details class="lockable">
      <summary>Label Studio config names</summary>
      <div class="grid three">
        <label class="num" for="fromName"><span>Labels<button type="button" class="tip" aria-label="About Labels" data-tip="The name of the Labels tag in your Label Studio labeling config that segments are added to. Only change it if your project uses a different name.">i</button></span><input type="text" id="fromName" spellcheck="false"></label>
        <label class="num" for="toName"><span>Audio<button type="button" class="tip" aria-label="About Audio" data-tip="The name of the Audio tag in your Label Studio labeling config that segments belong to.">i</button></span><input type="text" id="toName" spellcheck="false"></label>
        <label class="num" for="label"><span>Label value<button type="button" class="tip" aria-label="About Label value" data-tip="The label every added segment gets, exactly as it appears in the labeling config.">i</button></span><input type="text" id="label" spellcheck="false"></label>
      </div>
    </details>
    </div>

    <div class="col lockable">
    <section>
      <h2>Segments</h2>
      <div class="grid three">
        <label class="num" for="maxDur"><span>Max length<button type="button" class="tip" aria-label="About Max length" data-tip="Consecutive turns of the same speaker are joined only while the segment stays this long or shorter. One long turn is never split. Empty means no limit: one segment per speaker turn.">i</button></span><span class="unit"><input type="number" min="0" step="1" id="maxDur" placeholder="none"><em>s</em></span></label>
        <label class="num" for="pad"><span>Padding<button type="button" class="tip" aria-label="About Padding" data-tip="Extra time added before and after each segment so first and last words aren&#x27;t clipped. It never reaches into another speaker&#x27;s speech.">i</button></span><span class="unit"><input type="number" min="0" step="0.05" id="pad"><em>s</em></span></label>
        <label class="num" for="minSeg"><span>Min length<button type="button" class="tip" aria-label="About Min length" data-tip="Segments shorter than this are left out, such as coughs or one-word interjections.">i</button></span><span class="unit"><input type="number" min="0" step="0.1" id="minSeg"><em>s</em></span></label>
      </div>
      <label class="switch" for="dropOverlap">
        <span><b>Cut out overlapping speech<button type="button" class="tip" aria-label="About Cut out overlapping speech" data-tip="Removes moments where two or more people talk at once, so each segment has one speaker. Turn off to keep those moments inside segments.">i</button></b><small>Keeps one speaker per segment</small></span>
        <input type="checkbox" id="dropOverlap"><i></i>
      </label>
    </section>

    <section>
      <h2>Speakers <small>Leave empty for auto</small></h2>
      <div class="grid three">
        <label class="num" for="numSpeakers"><span>Exactly<button type="button" class="tip" aria-label="About Exactly" data-tip="The number of people speaking in the clip, if you know it. Often the easiest fix when two speakers get merged into one.">i</button></span><input type="number" min="0" step="1" id="numSpeakers" placeholder="auto"></label>
        <label class="num" for="minSpeakers"><span>At least<button type="button" class="tip" aria-label="About At least" data-tip="Lowest number of speakers to look for, when you don&#x27;t know the exact count.">i</button></span><input type="number" min="0" step="1" id="minSpeakers" placeholder="auto"></label>
        <label class="num" for="maxSpeakers"><span>At most<button type="button" class="tip" aria-label="About At most" data-tip="Highest number of speakers to look for, when you don&#x27;t know the exact count.">i</button></span><input type="number" min="0" step="1" id="maxSpeakers" placeholder="auto"></label>
      </div>
    </section>
    </div>
  </main>

  <div id="tooltip" role="tooltip" hidden></div>

  <footer>
    <span id="saved" class="saved" aria-live="polite">Changes save automatically</span>
    <button id="reset" class="link" type="button">Reset to defaults</button>
  </footer>

  <script src="defaults.js"></script>
  <script src="popup.js"></script>
</body></html>
